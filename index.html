<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Our South Island road trip, 24 Oct – 1 Nov 2026: route map, day plans, stays, food and bookings.">
<meta property="og:title" content="South Island Road Trip">
<meta property="og:description" content="Te Anau · Milford Sound · Wānaka · Lake Tekapo · Queenstown — 24 Oct – 1 Nov 2026">
<meta property="og:type" content="website">
<meta name="theme-color" content="#eedfb6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%238e1f17'/%3E%3Cpath d='M14 44 26 24l7 10 5-7 12 17z' fill='%23f6ead0'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>South Island Road Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: full-bleed vector map of the trip area; frosted panel floats left on desktop, bottom sheet on phones */
:root{
  --land:#f2f0eb; --hill:#e2ddd1; --park:#d4e8c8; --water:#a6d2f4; --water-ink:#3a7cba;
  --road:#ffffff; --road-edge:#d6d1c5; --hwy:#ffe7a6; --hwy-edge:#e3c46c; --park-ink:#3d7a3a; --route:#0a7aff; --route-edge:#ffffff; --town:#5b5b60;
  --ink:#1c1c1e; --ink-2:#636366; --ink-3:#8e8e93;
  --panel:rgba(249,249,251,.86); --card:#ffffff; --line:rgba(60,60,67,.13); --fill:rgba(118,118,128,.12);
  --stay:#c04cd9; --air:#56677d; --spot:#e8820c; --hike:#2f9e4f;
  --ok:#1f8a3a; --ok-bg:rgba(52,199,89,.15); --warn:#c25e00; --warn-bg:rgba(255,149,0,.17);
  --idea:#5856d6; --idea-bg:rgba(88,86,214,.12); --lore:#8a5a1a; --fuel:#0a7d74; --fuel-bg:rgba(10,125,116,.12); --food:#d1366b; --food-bg:rgba(255,45,85,.12); --check:#8f6200; --check-bg:rgba(255,204,0,.24);
  --shadow:0 10px 32px rgba(0,0,0,.13),0 1px 3px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --land:#2b2d31; --hill:#23252a; --park:#26382c; --water:#1c3a57; --water-ink:#7fb3e3;
  --road:#45484e; --road-edge:#1d1f22; --hwy:#6b6150; --hwy-edge:#2a2620; --park-ink:#8cc48a; --route:#3a93ff; --route-edge:#0f1c2c; --town:#b9bac0;
  --ink:#f2f2f7; --ink-2:#aeaeb2; --ink-3:#8e8e93;
  --panel:rgba(30,30,33,.86); --card:#2c2c2f; --line:rgba(255,255,255,.11); --fill:rgba(255,255,255,.08);
  --stay:#d77ae8; --air:#8a9bb0; --spot:#ff9f2e; --hike:#4cc46e;
  --ok:#4fd27a; --ok-bg:rgba(48,209,88,.17); --warn:#ffa940; --warn-bg:rgba(255,159,10,.18);
  --idea:#9d9bff; --idea-bg:rgba(125,122,255,.18); --lore:#e0a95a; --fuel:#3cc4b8; --fuel-bg:rgba(60,196,184,.16); --food:#ff6b93; --food-bg:rgba(255,55,95,.18); --check:#ffd60a; --check-bg:rgba(255,214,10,.15);
  --shadow:0 10px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --land:#2b2d31; --hill:#23252a; --park:#26382c; --water:#1c3a57; --water-ink:#7fb3e3;
  --road:#45484e; --road-edge:#1d1f22; --hwy:#6b6150; --hwy-edge:#2a2620; --park-ink:#8cc48a; --route:#3a93ff; --route-edge:#0f1c2c; --town:#b9bac0;
  --ink:#f2f2f7; --ink-2:#aeaeb2; --ink-3:#8e8e93;
  --panel:rgba(30,30,33,.86); --card:#2c2c2f; --line:rgba(255,255,255,.11); --fill:rgba(255,255,255,.08);
  --stay:#d77ae8; --air:#8a9bb0; --spot:#ff9f2e; --hike:#4cc46e;
  --ok:#4fd27a; --ok-bg:rgba(48,209,88,.17); --warn:#ffa940; --warn-bg:rgba(255,159,10,.18);
  --idea:#9d9bff; --idea-bg:rgba(125,122,255,.18); --lore:#e0a95a; --fuel:#3cc4b8; --fuel-bg:rgba(60,196,184,.16); --food:#ff6b93; --food-bg:rgba(255,55,95,.18); --check:#ffd60a; --check-bg:rgba(255,214,10,.15);
  --shadow:0 10px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--land);color:var(--ink);font:14px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
#mapwrap{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#mapwrap.dragging{cursor:grabbing}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none}
#ov>*{position:absolute;left:0;top:0;will-change:transform}

/* map strokes sized in screen px via --u (km per px) */
.rd-c{fill:none;stroke:var(--road-edge);stroke-width:calc(var(--u)*5px);stroke-linecap:round;stroke-linejoin:round}
.rd{fill:none;stroke:var(--road);stroke-width:calc(var(--u)*3px);stroke-linecap:round;stroke-linejoin:round}
.rd-c.hw{stroke:var(--hwy-edge);stroke-width:calc(var(--u)*5.5px)}
.rd.hw{stroke:var(--hwy);stroke-width:calc(var(--u)*3.5px)}
.rd-c.mn{stroke-width:calc(var(--u)*3.6px)}
.rd.mn{stroke-width:calc(var(--u)*2px)}
.park span{transform:translate(-50%,-50%);font-style:italic;font-weight:600;color:var(--park-ink);font-size:10.5px;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.shield span{transform:translate(-50%,-50%);background:var(--card);color:var(--ink-2);border:1px solid var(--hwy-edge);border-radius:4px;font:700 9.5px/1 var(--font-round);padding:2px 4px;text-shadow:none;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.peak em{display:block;font-style:normal;color:var(--ink-3);font-size:10px}
.leg-c{fill:none;stroke:var(--route-edge);stroke-width:calc(var(--u)*9px);stroke-linecap:round;stroke-linejoin:round}
.leg-l{fill:none;stroke:var(--route);stroke-width:calc(var(--u)*5.5px);stroke-linecap:round;stroke-linejoin:round}
.leg.opt .leg-c{stroke-width:calc(var(--u)*0px)}
.leg.opt .leg-l{stroke-dasharray:0 calc(var(--u)*10px);stroke-width:calc(var(--u)*6px)}
.leg{transition:opacity .25s}
.leg.dim{opacity:.22}
.leg.hot .leg-l{stroke-width:calc(var(--u)*7px)}

/* labels */
.lbl{font-size:11px;font-weight:500;color:var(--town);white-space:nowrap;transform-origin:0 0}
.lbl span{display:block;transform:translate(6px,-50%);text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 2px var(--land)}
.lbl i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--card);border:1.5px solid var(--town)}
.lake span{transform:translate(-50%,-50%);font-style:italic;color:var(--water-ink);font-weight:500;text-shadow:none;font-size:11px}
.region span{transform:translate(-50%,-50%);letter-spacing:.22em;font-size:10.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase}
.sea.small span{font-size:12px!important;letter-spacing:.08em!important;text-transform:none!important;font-style:italic!important;font-family:var(--font-map)!important}
.sea span{transform:translate(-50%,-50%);font-style:italic;color:var(--water-ink);font-size:13px;letter-spacing:.12em;text-shadow:none}
.peak span{transform:translate(-50%,2px);text-align:center;font-size:10.5px;color:var(--ink-2)}
.peak b{display:block;width:0;height:0;margin:0 auto 1px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid var(--ink-3)}

/* pins */
.pin{pointer-events:auto;cursor:pointer;z-index:3;outline:none}
.pin .dot{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.28);display:grid;place-items:center;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.pin.sm .dot{left:-14px;top:-14px;width:28px;height:28px}
.pin .dot svg{width:17px;height:17px;fill:#fff}
.pin.sm .dot svg{width:14px;height:14px}
.pin .num{position:absolute;right:-5px;top:-5px;min-width:16px;height:16px;border-radius:8px;background:#fff;color:var(--c);font:700 10px/16px var(--font-round);text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.pin .nm{position:absolute;top:21px;left:0;transform:translateX(-50%);white-space:nowrap;font-weight:600;font-size:12px;color:var(--ink);text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 3px var(--land)}
.pin.left .nm{top:-8px;left:-22px;transform:translateX(-100%)}
.pin:hover .dot,.pin:focus-visible .dot{transform:scale(1.1)}
.pin:focus-visible .dot{outline:3px solid var(--route);outline-offset:2px}
.pin.sel{z-index:6}
.pin.sel .dot{transform:scale(1.32)}
.pin.dim{opacity:.4}

/* drive bubbles */
.bubble{pointer-events:auto;cursor:pointer;z-index:2}
.bubble>div{transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;background:var(--card);color:var(--ink);border-radius:999px;padding:4px 9px 4px 6px;box-shadow:0 2px 8px rgba(0,0,0,.18);font:600 11.5px/1 var(--font);white-space:nowrap;font-variant-numeric:tabular-nums;transition:opacity .25s}
.bubble svg{width:15px;height:15px;fill:var(--route)}
.bubble small{font-weight:500;color:var(--ink-2);font-size:11px}
.bubble.opt>div{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bubble.dim>div{opacity:.35}
.bubble:focus-visible>div{outline:3px solid var(--route)}
.ctl button svg path[fill]{stroke:none}

/* callout */
#callout{pointer-events:auto;z-index:8}
#callout>div{position:absolute;left:0;bottom:30px;transform:translateX(-50%);background:var(--panel);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px 10px;width:max-content;max-width:250px;animation:pop .2s cubic-bezier(.3,1.4,.5,1)}
#callout>div:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--panel)}
#callout h4{margin:0;font-size:15px;font-weight:650;line-height:1.2}
#callout p{margin:2px 0 7px;color:var(--ink-2);font-size:12.5px}
#callout .row{display:flex;gap:5px;flex-wrap:wrap}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.85) translateY(6px)}to{opacity:1;transform:translateX(-50%)}}

/* controls */
.ctls{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:10}
.ctl{display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.ctl button{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;color:var(--ink-2)}
.ctl button+button{border-top:1px solid var(--line)}
.ctl button:hover{color:var(--route)}
.ctl button:focus-visible{outline:2px solid var(--route);outline-offset:-3px}
.ctl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* panel */
#panel{position:absolute;z-index:20;left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:12px;width:380px;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.handle{display:none}
.phead{padding:14px 16px 8px;display:flex;align-items:flex-start;gap:10px}
.phead h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.phead p{margin:1px 0 0;color:var(--ink-2);font-size:13px}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.days::-webkit-scrollbar{display:none}
.dchip{all:unset;cursor:pointer;flex:0 0 auto;min-width:42px;padding:5px 6px 6px;border-radius:10px;text-align:center;background:var(--fill);color:var(--ink)}
.dchip small{display:block;font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.dchip b{display:block;font:600 17px/1.15 var(--font-round);font-variant-numeric:tabular-nums}
.dchip.wide{padding-inline:12px}
.dchip.wide b{font-size:13px;line-height:1.55;font-family:var(--font)}
.dchip.on{background:var(--route);color:#fff}
.dchip.on small{color:rgba(255,255,255,.8)}
.dchip:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.pbody{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.pbody>*{flex-shrink:0}
.pbody h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--ink-2);margin-top:2px}
.sec{display:flex;flex-direction:column;gap:6px}
.sec>h3{margin:0 2px;font-size:13px;font-weight:600;color:var(--ink-2)}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.card.pad{padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:650 20px/1.1 var(--font-round);font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.idea{background:var(--idea-bg);color:var(--idea)}
.chip.check{background:var(--check-bg);color:var(--check)}
.chip.plan{background:var(--fill);color:var(--ink-2)}
.chip.food{background:var(--food-bg);color:var(--food)}
.bucket{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bucket div{background:var(--card);border-radius:12px;padding:9px 11px;min-width:0}
.bucket b{display:block;font-size:13px}
.bucket span{font-size:12px;color:var(--ink-2)}
.chip.bk{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}
.ph{font-size:12px;font-weight:600;color:var(--route);text-decoration:none;white-space:nowrap}
.ph:hover{text-decoration:underline}
.opts li .ph{margin-left:8px}
.lnks{display:flex;gap:12px;margin-top:3px;flex-wrap:wrap}
.ph.bkl{color:var(--warn)}
.kv dd a{color:var(--route);text-decoration:none}
.list>*{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);min-width:0}
.list>*:first-child{border-top:0}
button.rowbtn{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);box-sizing:border-box;width:100%}
.list>button.rowbtn:first-child{border-top:0}
button.rowbtn:hover{background:var(--fill)}
button.rowbtn:focus-visible{outline:2px solid var(--route);outline-offset:-2px}
.cal{flex:0 0 40px;text-align:center;border-radius:9px;background:var(--fill);padding:3px 0 4px}
.cal small{display:block;font-size:9.5px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.05em}
.cal b{display:block;font:600 17px/1.1 var(--font-round)}
.grow{flex:1;min-width:0}
.grow .t{font-weight:600}
.grow .s{color:var(--ink-2);font-size:12.5px}
.chev{color:var(--ink-3);font-size:18px;line-height:1}
.ico{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c)}
.ico svg{width:16px;height:16px;fill:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.notes{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2)}
.notes li{padding-left:14px;position:relative}
.notes li:before{content:"";position:absolute;left:3px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
.notes li.flag{color:var(--warn)}
.notes li.flag:before{background:var(--warn)}
.legcard{display:flex;align-items:center;gap:12px}
.legcard .big{font:650 19px/1.1 var(--font-round);font-variant-numeric:tabular-nums}
.legcard .s{color:var(--ink-2);font-size:12.5px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--route);color:#fff;font-weight:600;font-size:13px;padding:7px 12px;border-radius:999px;white-space:nowrap}
.btn.ghost{background:var(--fill);color:var(--route)}
.btn:focus-visible{outline:2px solid var(--route);outline-offset:2px}
/* agenda */
.agenda{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .tm{font:600 12px/1.6 var(--font-round);color:var(--ink-3);font-variant-numeric:tabular-nums}
.item .top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.item .ti{font-weight:600;line-height:1.35;min-width:0}
.item .nt{margin:3px 0 0;color:var(--ink-2);font-size:12.5px}
.opts{margin:7px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.opts li{font-size:12.5px;background:var(--fill);border-radius:8px;padding:6px 9px;color:var(--ink-2)}
.opts li b{color:var(--ink);font-weight:600}
.opts .ol{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:none;padding:2px 0 0}
.daygrp{font-weight:600;font-size:12.5px;color:var(--ink-2);padding:9px 14px 0}
.navrow{display:flex;justify-content:space-between;gap:8px}
.back{all:unset;cursor:pointer;color:var(--route);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.sites{display:flex;flex-wrap:wrap;gap:6px}
.sites a{font-size:12.5px;font-weight:600;color:var(--route);background:var(--fill);border-radius:999px;padding:4px 10px;text-decoration:none}
.sites a:hover{background:var(--line)}
.foot{color:var(--ink-3);font-size:11.5px;padding:0 2px}

#ov.z-lo .k-air,#ov.z-lo .k-hike{display:none}
#ov.z-lo .bubble small{display:none}
#ov.z-lo .bubble.opt,#ov.z-lo .bubble.each{display:none}
@media (max-width:720px){
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;height:50%;border-radius:18px 18px 0 0;transition:height .32s cubic-bezier(.3,.9,.3,1);box-shadow:0 -6px 24px rgba(0,0,0,.14)}
  #panel.full{height:90%}
  #panel.mini{height:132px}
  .handle{all:unset;display:block;cursor:grab;padding:8px 0 2px;width:100%;text-align:center;touch-action:none}
  .handle i{display:inline-block;width:36px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.45}
  .phead{padding:2px 16px 8px;touch-action:none;cursor:grab}
  .phead h1{font-size:18px}
  .phead p{font-size:12.5px}
  .days{padding:0 16px 10px;gap:5px;scroll-padding-inline:16px}
  .dchip{min-width:40px;padding:4px 4px 5px;border-radius:9px}
  .dchip b{font-size:16px}

/* lore, fuel, sun, today, journey */
.lore{pointer-events:auto;cursor:pointer;z-index:2}
.lore .lr-dot{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:7px;background:var(--lore);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.3);border:1.5px solid #fff}
.lore .lr-dot svg{width:14px;height:14px;fill:#fff}
.lore span{position:absolute;top:14px;left:0;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-style:italic;color:var(--lore);font-weight:600;text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 3px var(--land)}
.lore:focus-visible .lr-dot{outline:2px solid var(--route);outline-offset:2px}
.fuel .fu-dot{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--fuel);display:grid;place-items:center;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.fuel .fu-dot svg{width:11px;height:11px;fill:#fff}
.lr-s{margin:0 0 6px!important;color:var(--ink)!important;font-size:13px!important;line-height:1.4}
#callout .eyebrow{font-size:10.5px;margin-bottom:1px}
.sunline .temp b{color:var(--ink);font-weight:650}
.sunline .temp small{font-size:11px;color:var(--ink-3)}
.drivetot{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.drivetot svg{width:15px;height:15px;fill:var(--route);flex:0 0 auto}
.drivetot b{color:var(--ink);font-weight:650}
.drivetot small{color:var(--ink-3);font-size:11.5px}
.caution{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:10px 12px;color:var(--ink)}
.caution svg{width:18px;height:18px;fill:var(--warn);flex:0 0 auto;margin-top:1px}
.caution b{display:block;color:var(--warn);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.caution ul{margin:4px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.35}
#app[data-style="tale"] .caution{border-radius:6px}
.sunline{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.nowcard{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line)}
button.nowcard{flex-direction:row;align-items:center;background:var(--card);border-radius:12px}
.nowcard .big2{font-size:16px;font-weight:650}
.cd{display:flex;align-items:baseline;gap:8px}
.cd b{font:700 34px/1 var(--font-round);font-variant-numeric:tabular-nums;color:var(--route)}
.cd span{font-size:14px;color:var(--ink-2)}
.item.past{opacity:.45}
.item.next{box-shadow:inset 3px 0 0 var(--route);background:var(--fill)}
.chip.nowtag{background:var(--route);color:#fff}
.chip.fuel{background:var(--fuel-bg);color:var(--fuel)}
.play-line{fill:none;stroke:var(--route);stroke-width:calc(var(--u)*6px);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1}

#caption{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:12;pointer-events:none;max-width:calc(100% - 140px)}
#caption>div{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);border-radius:14px;padding:9px 16px 10px;text-align:center;display:flex;flex-direction:column;gap:1px}
#caption small{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
#caption b{font-size:16px;text-wrap:balance}
#caption span{font-size:12.5px;color:var(--ink-2)}
#caption.in>div{animation:capin .45s ease-out}
@keyframes capin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (min-width:721px){#caption{left:calc(50% + 196px)}}

#app[data-style="tale"] .lore span{font:italic 13px var(--font-map)}
#app[data-style="tale"] .cd b{font-family:var(--font-title)}

/* flight scene */
#flight{position:absolute;inset:0;z-index:11;pointer-events:none;background:var(--water)}

.fl-sea{fill:var(--water)}

#flsvg text{font-family:var(--font)}
.fl-name{fill:var(--ink);font-weight:650;font-size:calc(var(--fu,1)*14px)}

#app[data-style="tale"] .fl-land{stroke:var(--ink-2);stroke-width:calc(var(--fu,1)*1.6px)}

#app[data-style="tale"] .fl-name{font-weight:400;font-size:calc(var(--fu,1)*17px)}
#app[data-style="tale"] .fl-sea-l{font-family:var(--font-title);font-size:calc(var(--fu,1)*16px);letter-spacing:.35em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function sunTimes(y,m,d,lat,lon,zen){
  const rad=Math.PI/180,N=Math.round((Date.UTC(y,m-1,d)-Date.UTC(y,0,0))/864e5),g=2*Math.PI/365*(N-1);

  const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const c=Math.cos((zen||90.833)*rad)/(Math.cos(lat*rad)*Math.cos(decl))-Math.tan(lat*rad)*Math.tan(decl);

let actx=null;
function audio(){

function env(a,g,t0,peak,attack,end){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+attack);g.gain.exponentialRampToValueAtTime(0.0001,end);}
function sfxLand(){
  const a=audio();if(!a)return;const t=a.currentTime;
  /* engine whine winding down */
  const o=a.createOscillator(),lp=a.createBiquadFilter(),g=a.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(1900,t);o.frequency.exponentialRampToValueAtTime(380,t+1.5);
  lp.type='lowpass';lp.frequency.value=2600;env(a,g,t,.05,.18,t+1.5);
  o.connect(lp);lp.connect(g);g.connect(a.destination);o.start(t);o.stop(t+1.6);
  /* air rushing past */
  const n=a.createBufferSource(),len=Math.floor(a.sampleRate*1.7),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  n.buffer=buf;const bp=a.createBiquadFilter(),g2=a.createGain();
  bp.type='bandpass';bp.Q.value=1.1;bp.frequency.setValueAtTime(2600,t);bp.frequency.exponentialRampToValueAtTime(260,t+1.6);
  env(a,g2,t,.32,.3,t+1.65);n.connect(bp);bp.connect(g2);g2.connect(a.destination);n.start(t);n.stop(t+1.7);
  /* wheels touching down */
  const th=a.createOscillator(),g3=a.createGain(),tt=t+.62;
  th.type='sine';th.frequency.setValueAtTime(95,tt);th.frequency.exponentialRampToValueAtTime(42,tt+.28);
  env(a,g3,tt,.45,.012,tt+.32);th.connect(g3);g3.connect(a.destination);th.start(tt);th.stop(tt+.36);
}
function sfxArrive(){
  const a=audio();if(!a)return;const t=a.currentTime;
  [[1046.5,0],[1568,.11]].forEach(([f,dt])=>{
    const o=a.createOscillator(),g=a.createGain(),o2=a.createOscillator(),g2=a.createGain();
    o.type='sine';o.frequency.value=f;env(a,g,t+dt,.16,.008,t+dt+.9);
    o2.type='sine';o2.frequency.value=f*2.01;env(a,g2,t+dt,.04,.006,t+dt+.35);
    o.connect(g);g.connect(a.destination);o2.connect(g2);g2.connect(a.destination);
    o.start(t+dt);o.stop(t+dt+1);o2.start(t+dt);o2.stop(t+dt+.4);
  });
}

  for(const p of PINL){if(p.el.hidden||p.el.offsetParent===null)continue;const q=box(p.el);if(q)placed.push(q);}
  const order=BUBL.slice().sort((a,b)=>(a.el.classList.contains('dim')-b.el.classList.contains('dim'))||(b.main-a.main));
  for(const bb of order){
    const d=bb.el.firstElementChild,w=d.offsetWidth,h=d.offsetHeight;
    if(!w){bb.el.style.visibility='hidden';continue;}
    let ok=false;
    for(const c of bb.c){
      const sx=(c[0]-x0)*s,sy=(c[1]-y0)*s,q={l:sx-w/2-3,r:sx+w/2+3,t:sy-h/2-3,b:sy+h/2+3};
      if(offscreen(q))continue;
      if(!hit(q)){bb.el.style.transform=`translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px)`;placed.push(q);ok=true;break;}
    }
    bb.el.style.visibility=ok?'':'hidden';
  }
  for(const o of LBLS){
    if(o.el.hidden)continue;
    const q=box(o.el);if(!q)continue;
    if(hit(q)){o.el.style.visibility='hidden';}else{placed.push(q);}
  }
}
let tw=null;
function stopTween(){if(tw){cancelAnimationFrame(tw);tw=null;}}
function animateTo(t){
  stopTween();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){Object.assign(view,t);apply();return;}
  const f={...view},t0=performance.now(),D=520;
  const step=now=>{
    const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);
    view.s=Math.exp(Math.log(f.s)+(Math.log(t.s)-Math.log(f.s))*e);
    view.x=f.x+(t.x-f.x)*e;view.y=f.y+(t.y-f.y)*e;apply();
    tw=k<1?requestAnimationFrame(step):null;
  };tw=requestAnimationFrame(step);
}
function pads(){
  const W=wrap.clientWidth,H=wrap.clientHeight;
  if(mobile())return {l:40,r:72,t:60,b:sheetH()+50};
  return {l:panel.getBoundingClientRect().width+12+50,r:70,t:60,b:60};
}
function fitLL(lls,maxS){
  const pts=lls.map(a=>P(a[0],a[1]));
  let x1=Math.min(...pts.map(p=>p[0])),x2=Math.max(...pts.map(p=>p[0])),y1=Math.min(...pts.map(p=>p[1])),y2=Math.max(...pts.map(p=>p[1]));
  const W=wrap.clientWidth,H=wrap.clientHeight,p=pads();
  const aw=Math.max(80,W-p.l-p.r),ah=Math.max(80,H-p.t-p.b);
  let s=Math.min(aw/Math.max(x2-x1,1),ah/Math.max(y2-y1,1),maxS||9);
  s=Math.max(S_MIN,s);
  animateTo({s,x:(x1+x2)/2-(p.l-p.r)/2/s,y:(y1+y2)/2-(p.t-p.b)/2/s});
}
function zoomAt(px,py,f){
  const W=wrap.clientWidth,H=wrap.clientHeight;
  const kx=view.x+(px-W/2)/view.s,ky=view.y+(py-H/2)/view.s;
  view.s=Math.min(S_MAX,Math.max(S_MIN,view.s*f));
  view.x=kx-(px-W/2)/view.s;view.y=ky-(py-H/2)/view.s;apply();
}
wrap.addEventListener('wheel',e=>{e.preventDefault();stopTween();const r=wrap.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0016)));},{passive:false});
const ptrs=new Map();let moved=0;
wrap.addEventListener('pointerdown',e=>{
  if(e.target.closest('.pin,.bubble,#callout'))return;
  stopTween();wrap.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;wrap.classList.add('dragging');
});
wrap.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId),r=wrap.getBoundingClientRect();
  if(ptrs.size===1){
    const dx=e.clientX-prev.x,dy=e.clientY-prev.y;moved+=Math.abs(dx)+Math.abs(dy);
    view.x-=dx/view.s;view.y-=dy/view.s;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});apply();
  }else if(ptrs.size===2){
    const other=[...ptrs.entries()].find(([k])=>k!==e.pointerId)[1];
    const d0=Math.hypot(prev.x-other.x,prev.y-other.y),d1=Math.hypot(e.clientX-other.x,e.clientY-other.y);
    const mx=(e.clientX+other.x)/2-r.left,my=(e.clientY+other.y)/2-r.top;
    if(d0>0)zoomAt(mx,my,d1/d0);
    view.x-=(e.clientX-prev.x)/2/view.s;view.y-=(e.clientY-prev.y)/2/view.s;moved+=20;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});apply();
  }
});
const endPtr=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(!ptrs.size){wrap.classList.remove('dragging');if(moved<6&&e.type==='pointerup')hideCallout();}};
wrap.addEventListener('pointerup',endPtr);wrap.addEventListener('pointercancel',endPtr);

document.getElementById('zout').onclick=()=>{stopTween();zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1/1.6)};

let sheet='half';
function sheetH(st){st=st||sheet;const H=innerHeight;return st==='full'?H*0.9:st==='mini'?132:Math.round(H*0.5);}
function setSheet(st){sheet=st;panel.style.height='';panel.classList.toggle('full',st==='full');panel.classList.toggle('mini',st==='mini');}
(function(){
  const grab=[document.getElementById('handle'),panel.querySelector('.phead')];
  let y0=null,h0=0,dy=0;
  grab.forEach(el=>{
    el.addEventListener('pointerdown',e=>{if(!mobile())return;y0=e.clientY;h0=panel.getBoundingClientRect().height;dy=0;el.setPointerCapture(e.pointerId);panel.style.transition='none';});
    el.addEventListener('pointermove',e=>{if(y0===null)return;dy=e.clientY-y0;panel.style.height=Math.max(110,Math.min(innerHeight*0.92,h0-dy))+'px';});
    const up=()=>{if(y0===null)return;y0=null;panel.style.transition='';
      if(Math.abs(dy)<6){setSheet(sheet==='full'?'half':sheet==='mini'?'half':'full');return;}
      const h=h0-dy,c=['mini','half','full'].map(k=>[k,Math.abs(sheetH(k)-h)]).sort((a,b)=>a[1]-b[1])[0][0];setSheet(c);};
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  });
})();

function show(v,id,move){
  pbody.scrollTop=0;cur={v,id};
  if(v==='overview'){renderOverview();setChip('overview');highlight(null,null);hideCallout();if(move)fitAll();}
  else if(v==='day'){
    const d=dayById(id);renderDay(id);markNow();setChip(id);highlight(id,null);hideCallout();
    if(move){const lls=d.legs.flatMap(l=>LEGS[l].path);lls.push(PLACES[d.base].ll);fitLL(lls,lls.length>3?9:7);}
  }else{
    const p=PLACES[id];renderPlace(id);setChip(p.days.length===1?p.days[0]:null);highlight(null,id);showCallout(id);
    if(move){const lls=[p.ll];if(p.legIn)lls.push(...LEGS[p.legIn].path.slice(-4));fitLL(lls,7.5);}
  }
  if(mobile()&&move&&sheet!=='half')setSheet('half');
  try{history.replaceState(null,'',v==='overview'?location.pathname+location.search:'#'+(id))}catch(e){}
}
